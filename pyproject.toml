[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-engine"
version = "0.1.0"
description = "TRACE - Tamper-Resistant Record Audit & Cross-source Evidence Engine"
requires-python = ">=3.10"
dependencies = ["cryptography>=43.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
